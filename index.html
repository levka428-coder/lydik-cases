<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LYDIK — Симулятор кейсов CS2</title>
  <style>
    :root { --bg-color: #080b10; --card-bg: rgba(21, 26, 35, 0.75); --accent: #ff8c00; --text: #ffffff; --text-muted: #8a94a6; --success: #00ff88; --fail: #e74c3c; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding-bottom: 50px; min-height: 100vh; overflow-x: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(21, 26, 35, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); z-index: 100; position: relative; gap: 15px; flex-wrap: wrap; }
    .logo { font-size: 24px; font-weight: 900; background: linear-gradient(45deg, #ff8c00, #ff0055); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
    
    .nav-tabs { display: flex; gap: 10px; }
    .nav-btn { background: transparent; color: var(--text-muted); border: 1px solid transparent; font-size: 15px; font-weight: bold; padding: 6px 16px; cursor: pointer; border-radius: 8px; transition: 0.3s; }
    .nav-btn:hover { color: var(--text); }
    .nav-btn.active { color: var(--accent); border: 1px solid rgba(255, 140, 0, 0.4); background: rgba(255, 140, 0, 0.1); }
    
    .balance-box { font-size: 15px; background: rgba(11, 14, 20, 0.8); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255, 140, 0, 0.4); cursor: pointer; white-space: nowrap; }
    #balance { color: var(--success); font-weight: bold; }

    .btn { background: linear-gradient(135deg, var(--accent), #ff5500); color: #000; border: none; padding: 14px 40px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; width: 100%; max-width: 300px; }
    .btn:hover:not(:disabled) { transform: scale(1.03); box-shadow: 0 0 15px rgba(255,140,0,0.4); }
    .btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .item-card { width: 110px; height: 130px; margin: 0 5px; background: rgba(26, 33, 45, 0.8); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px; flex-shrink: 0; font-size: 11px; text-align: center; border-bottom: 4px solid #888; cursor: pointer; position: relative; }
    .item-visual { width: 95px; height: 65px; display: flex; align-items: center; justify-content: center; margin-top: 5px; background: rgba(0,0,0,0.3); border-radius: 6px; }
    .item-visual img { max-width: 90%; max-height: 90%; object-fit: contain; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6)); }
    .item-card .item-name { font-weight: 600; line-height: 1.2; }
    .item-card .item-price { color: var(--success); font-weight: bold; }
    .item-card.blue { border-bottom-color: #4b69ff; } .item-card.purple { border-bottom-color: #d32ce6; } .item-card.pink { border-bottom-color: #eb4b4b; } .item-card.gold { border-bottom-color: #ffd700; }
    .item-card.selected-for-upg { box-shadow: 0 0 15px var(--accent); border: 2px solid var(--accent); }
    
    .btn-sell { background: #e74c3c; color: #fff; border: none; padding: 4px 0; font-size: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 4px; }

    .section-zone { max-width: 900px; margin: 20px auto; text-align: center; background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .multi-roulette-container { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; }
    .roulette-wrapper { position: relative; width: 100%; height: 140px; overflow: hidden; background: rgba(11, 14, 20, 0.9); border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.08); }
    .pointer { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: var(--accent); z-index: 10; transform: translateX(-50%); box-shadow: 0 0 15px var(--accent); }
    .roulette-track { display: flex; position: absolute; left: 0; top: 5px; }
    
    .controls-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .selector-row { display: flex; align-items: center; gap: 8px; justify-content: center; }
    .count-btn, .speed-btn { background: rgba(26, 33, 45, 0.8); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.08); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .count-btn.active, .speed-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .cases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .case-card { background: var(--card-bg); border-radius: 14px; padding: 20px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
    .case-card:hover { border-color: var(--accent); transform: translateY(-5px); }
    .case-visual { width: 140px; height: 110px; display: flex; align-items: center; justify-content: center; margin: 12px auto; background: rgba(0,0,0,0.3); border-radius: 10px; }
    .case-visual img { max-width: 85%; max-height: 85%; object-fit: contain; }

    .upgrader-wrapper { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 30px auto; padding: 30px 20px; background: var(--card-bg); border-radius: 16px; position: relative; gap: 15px; }
    .upg-slot { width: 140px; height: 180px; background: rgba(11, 14, 20, 0.8); border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
    .upg-slot:hover { border-color: rgba(255, 140, 0, 0.5); }
    .upg-slot.active-slot { border-color: var(--accent); background: rgba(21, 26, 35, 1); cursor: default; }
    .upg-slot .item-card { margin: 0; width: 100%; height: 100%; border: none; background: transparent; cursor: default; }
    
    .upg-center { position: relative; display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
    .upg-wheel-container { width: 240px; height: 240px; border-radius: 50%; border: 6px solid #141a24; position: relative; background: #1a2230; box-shadow: 0 0 25px rgba(0,0,0,0.5); }
    .upg-wheel { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#1b2432 0deg, #1b2432 360deg); overflow: hidden; transition: background 0.3s ease; }
    .upg-rotating-pointer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; pointer-events: none; z-index: 5; transform-origin: center center; }
    .upg-arrow-tip { position: absolute; top: -20px; left: calc(50% - 9px); width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 25px solid #ffaa33; filter: drop-shadow(0 0 5px rgba(255, 170, 51, 0.8)); }
    .upg-inner { position: absolute; top: 13%; left: 13%; width: 74%; height: 74%; background: #0c1017; border-radius: 50%; border: 4px solid #1b2432; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 6; }
    
    #upg-chance { font-size: 26px; font-weight: bold; color: #fff; margin-bottom: 8px; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
    #upg-msg { font-size: 12px; font-weight: bold; position: absolute; bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

    .upg-lightning-btn { position: absolute; top: 10px; right: 10px; background: rgba(26, 33, 45, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-muted); font-size: 18px; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; z-index: 10; }
    .upg-lightning-btn:hover { border-color: var(--accent); color: var(--text); }
    .upg-lightning-btn.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }

    .inventory-section { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .inventory-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; min-height: 120px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
    .modal { background: rgba(21, 26, 35, 0.95); border: 1px solid rgba(255, 140, 0, 0.3); padding: 20px; border-radius: 16px; text-align: center; width: 100%; max-width: 340px; }
    .modal input { width: 100%; padding: 10px; background: #0b0e14; border: 1px solid #2a3447; border-radius: 8px; color: var(--success); font-size: 18px; font-weight: bold; text-align: center; outline: none; margin: 15px 0; }
    .modal-buttons { display: flex; gap: 10px; justify-content: center; }
    .modal-btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: #333; color: #fff; transition: 0.2s; width: 100%; }
    .modal-btn:hover { background: #444; }
    .modal-btn.confirm { background: var(--accent); color: #000; }
    .modal-btn.confirm:hover { background: #ff9f1a; }
    
    #skins-modal .modal { max-width: 500px; }
    .skins-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-height: 350px; overflow-y: auto; margin-top: 15px; }

    /* Мобильная адаптация */
    @media (max-width: 768px) {
      header { padding: 12px 15px; justify-content: center; }
      .logo { display: none; }
      .nav-tabs { order: 1; width: 100%; justify-content: center; }
      .balance-box { order: 2; font-size: 14px; padding: 6px 14px; }
      
      .upgrader-wrapper { flex-direction: column; padding: 20px 10px; }
      .upg-slot { width: 100%; height: 100px; flex-direction: row; justify-content: space-around; }
      .upg-slot .item-card { width: 80px; height: 90px; }
      .upg-wheel-container { width: 200px; height: 200px; }
      
      .section-zone { padding: 15px 10px; margin: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">LYDIK</div>
    <div class="nav-tabs">
      <button class="nav-btn active" id="tab-cases" onclick="switchTab('cases')">Кейсы</button>
      <button class="nav-btn" id="tab-upgrader" onclick="switchTab('upgrader')">Апгрейдер</button>
    </div>
    <div class="balance-box" onclick="document.getElementById('deposit-modal').style.display='flex'">Баланс: <span id="balance">100</span> ₽</div>
  </header>

  <main id="view-cases">
    <section class="section-zone">
      <h2 id="current-case-name" style="font-size: 20px; margin-bottom: 15px;">Выберите кейс для открытия</h2>
      <div class="multi-roulette-container" id="roulettes-container">
        <div class="roulette-wrapper"><div class="pointer"></div><div class="roulette-track" id="track-0"></div></div>
      </div>
      <div class="controls-container">
        <div class="selector-row">
          <button class="count-btn active" onclick="setCount(1, this)">x1</button>
          <button class="count-btn" onclick="setCount(2, this)">x2</button>
          <button class="count-btn" onclick="setCount(3, this)">x3</button>
          <button class="count-btn" onclick="setCount(4, this)">x4</button>
        </div>
        <div class="selector-row">
          <button class="speed-btn active" onclick="setSpeed(6, this)">Обычная</button>
          <button class="speed-btn" onclick="setSpeed(2, this)">Быстрая</button>
        </div>
      </div>
      <button class="btn" id="open-btn" onclick="openCase()" disabled>Открыть кейс</button>
    </section>

    <section>
      <div class="cases-grid">
        <div class="case-card" onclick="selectCase('bomj')">
          <div class="case-title">Бомж Кейс</div>
          <div class="case-visual"><img src="img/case_bomj.png" alt="Бомж кейс"></div>
          <div style="color:var(--success); font-weight:bold;">30 ₽</div>
        </div>
        <div class="case-card" onclick="selectCase('standart')">
          <div class="case-title">Стандартный</div>
          <div class="case-visual"><img src="img/case_standart.png" alt="Стандартный кейс"></div>
          <div style="color:var(--success); font-weight:bold;">50 ₽</div>
        </div>
        <div class="case-card" onclick="selectCase('major')">
          <div class="case-title">Мажор Кейс</div>
          <div class="case-visual"><img src="img/case_major.png" alt="Мажор кейс"></div>
          <div style="color:var(--success); font-weight:bold;">100 ₽</div>
        </div>
      </div>
    </section>
  </main>

  <main id="view-upgrader" style="display: none;">
    <div class="upgrader-wrapper">
      <button class="upg-lightning-btn" id="upg-lightning" onclick="toggleUpgFastMode()" title="Быстрая прокрутка">⚡</button>
      
      <div class="upg-slot" id="upg-input" onclick="switchTab('cases')">
        <span style="color: #666; font-size: 13px;">Ваш скин<br>(Нажмите в инвентаре)</span>
      </div>
      <div class="upg-center">
        <div class="upg-wheel-container">
          <div class="upg-rotating-pointer" id="upg-rotating-pointer"><div class="upg-arrow-tip"></div></div>
          <div class="upg-wheel" id="upg-wheel"></div>
          <div class="upg-inner">
            <div id="upg-chance">0%</div>
            <button class="btn" id="btn-do-upgrade" onclick="executeUpgrade()" disabled style="padding: 8px 20px; font-size: 13px; width: auto;">Апгрейд</button>
            <div id="upg-msg"></div>
          </div>
        </div>
      </div>
      <div class="upg-slot" id="upg-target" onclick="openSkinsModal()">
        <span style="color: #666; font-size: 13px;">Желаемый скин<br>(Нажмите для выбора)</span>
      </div>
    </div>
  </main>

  <section class="inventory-section">
    <h2 style="font-size: 20px;">Ваш инвентарь</h2>
    <div class="inventory-grid" id="inventory">
      <div style="color:#666; width: 100%; text-align: center;">Инвентарь пуст</div>
    </div>
  </section>

  <!-- Модальное окно пополнения -->
  <div class="modal-overlay" id="deposit-modal">
    <div class="modal">
      <h3>Пополнение баланса</h3>
      <input type="number" id="deposit-amount" value="500" min="10">
      <div class="modal-buttons">
        <button class="modal-btn confirm" onclick="confirmDeposit()">Оплатить</button>
        <button class="modal-btn" onclick="document.getElementById('deposit-modal').style.display='none'">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно выбора желаемого скина для апгрейдера -->
  <div class="modal-overlay" id="skins-modal">
    <div class="modal">
      <h3>Выберите желаемый скин</h3>
      <div class="skins-grid" id="skins-grid-modal"></div>
      <button class="modal-btn" style="margin-top: 15px;" onclick="document.getElementById('skins-modal').style.display='none'">Закрыть</button>
    </div>
  </div>

  <!-- Модальное окно выигрыша из кейса -->
  <div class="modal-overlay" id="win-modal">
    <div class="modal">
      <h3 style="margin-bottom: 5px;">Вы выиграли!</h3>
      <div id="win-items-container" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0;"></div>
      <div class="modal-buttons" style="flex-direction: column;">
        <button class="modal-btn confirm" onclick="sellWonItemsModal()">Продать все (<span id="win-total-price">0</span> ₽)</button>
        <button class="modal-btn" onclick="takeWonItemsModal()" style="background: #2a3447;">Забрать в инвентарь</button>
      </div>
    </div>
  </div>

  <script>
    let balance = 100;
    let selectedCaseKey = null;
    let isActionActive = false;
    let inventory = [];
    let openingCount = 1;
    let spinSpeed = 6;
    let currentTab = 'cases';
    let upgFastMode = false;
    let lastWonItems = [];

    const skinsData = {
      p250: { name: "P250 | Sand Dune", rarity: "blue", price: 10, img: "img/p250.png" },
      glock: { name: "Glock-18 | Water", rarity: "purple", price: 35, img: "img/glock.png" },
      m4a4: { name: "M4A4 | Evil Daimyo", rarity: "purple", price: 65, img: "img/m4a4.png" },
      ak47: { name: "AK-47 | Redline", rarity: "pink", price: 180, img: "img/ak47.png" },
      awp: { name: "AWP | Hyper Beast", rarity: "pink", price: 250, img: "img/awp.png" },
      karambit: { name: "★ Karambit | Fade", rarity: "gold", price: 1500, img: "img/karambit.png" }
    };

    const cases = {
      bomj: { name: "Бомж Кейс", price: 30, items: [skinsData.p250, skinsData.glock, skinsData.m4a4] },
      standart: { name: "Стандартный", price: 50, items: [skinsData.p250, skinsData.glock, skinsData.m4a4, skinsData.ak47] },
      major: { name: "Мажор Кейс", price: 100, items: [skinsData.m4a4, skinsData.ak47, skinsData.awp, skinsData.karambit] }
    };

    function switchTab(tab) {
      if (isActionActive) return;
      currentTab = tab;
      document.getElementById('view-cases').style.display = tab === 'cases' ? 'block' : 'none';
      document.getElementById('view-upgrader').style.display = tab === 'upgrader' ? 'block' : 'none';
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      updateInventoryDisplay();
    }

    function confirmDeposit() {
      const amt = parseInt(document.getElementById('deposit-amount').value);
      if (amt > 0) {
        balance += amt; 
        document.getElementById('balance').innerText = balance; 
        if (selectedCaseKey && currentTab === 'cases') selectCase(selectedCaseKey); 
        document.getElementById('deposit-modal').style.display='none';
      }
    }

    function setCount(count, btn) {
      if (isActionActive) return;
      openingCount = count;
      document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (selectedCaseKey) selectCase(selectedCaseKey);
    }
    
    function setSpeed(speed, btn) {
      if (isActionActive) return;
      spinSpeed = speed;
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function toggleUpgFastMode() {
      if (isActionActive) return;
      upgFastMode = !upgFastMode;
      const btn = document.getElementById('upg-lightning');
      if (upgFastMode) btn.classList.add('active');
      else btn.classList.remove('active');
    }

    function selectCase(caseKey) {
      if (isActionActive) return;
      selectedCaseKey = caseKey;
      const currentCase = cases[caseKey];
      const totalPrice = currentCase.price * openingCount;
      
      document.getElementById('current-case-name').innerText = currentCase.name;
      document.getElementById('open-btn').innerText = `Открыть (${totalPrice} ₽)`;
      document.getElementById('open-btn').disabled = balance < totalPrice;

      const container = document.getElementById('roulettes-container');
      container.innerHTML = '';
      for (let i = 0; i < openingCount; i++) {
        container.innerHTML += `<div class="roulette-wrapper"><div class="pointer"></div><div class="roulette-track" id="track-${i}"></div></div>`;
        generateTrack(currentCase.items, `track-${i}`);
      }
    }

    function generateTrack(items, trackId) {
      const track = document.getElementById(trackId);
      track.style.transition = 'none'; 
      track.style.transform = 'translateX(0px)'; 
      track.innerHTML = '';
      for (let i = 0; i < 35; i++) {
        const item = items[Math.floor(Math.random() * items.length)];
        track.innerHTML += `<div class="item-card ${item.rarity}"><div class="item-visual"><img src="${item.img}" alt=""></div><div class="item-name">${item.name}</div></div>`;
      }
    }

    function openCase() {
      if (isActionActive || !selectedCaseKey) return;
      const currentCase = cases[selectedCaseKey];
      const totalPrice = currentCase.price * openingCount;
      if (balance < totalPrice) return;

      balance -= totalPrice;
      document.getElementById('balance').innerText = balance;
      isActionActive = true;
      document.getElementById('open-btn').disabled = true;

      const items = currentCase.items;
      const winnerIndex = 28; 
      const cardWidth = 120; 
      const wrapperWidth = document.querySelector('.roulette-wrapper').offsetWidth;
      const baseShift = (winnerIndex * cardWidth) - (wrapperWidth / 2) + (cardWidth / 2);
      
      const overscroll = 40; 
      const targetShift = baseShift + overscroll;

      lastWonItems = [];

      for (let i = 0; i < openingCount; i++) {
        const winnerItem = items[Math.floor(Math.random() * items.length)];
        lastWonItems.push(winnerItem);
        const track = document.getElementById(`track-${i}`);
        const cards = track.getElementsByClassName('item-card');
        
        cards[winnerIndex].className = `item-card ${winnerItem.rarity}`;
        cards[winnerIndex].innerHTML = `<div class="item-visual"><img src="${winnerItem.img}" alt=""></div><div class="item-name">${winnerItem.name}</div>`;
        
        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        void track.offsetWidth; 
        
        track.style.transition = `transform ${spinSpeed}s cubic-bezier(0.08, 0.75, 0.12, 1.05)`; 
        track.style.transform = `translateX(-${targetShift}px)`;
      }

      setTimeout(() => {
        for (let i = 0; i < openingCount; i++) {
          const track = document.getElementById(`track-${i}`);
          track.style.transition = 'transform 0.35s ease-out';
          track.style.transform = `translateX(-${baseShift}px)`;
        }
      }, spinSpeed * 1000);

      setTimeout(() => {
        isActionActive = false;
        document.getElementById('open-btn').disabled = balance < (currentCase.price * openingCount);
        showWinModal(lastWonItems);
      }, (spinSpeed * 1000) + 380);
    }

    function showWinModal(items) {
      const container = document.getElementById('win-items-container');
      container.innerHTML = '';
      let totalSum = 0;

      items.forEach(item => {
        totalSum += item.price;
        container.innerHTML += `
          <div class="item-card ${item.rarity}" style="width: 90px; height: 110px; font-size: 10px;">
            <div class="item-visual" style="width: 75px; height: 50px;"><img src="${item.img}" alt=""></div>
            <div class="item-name">${item.name}</div>
            <div class="item-price">${item.price} ₽</div>
          </div>
        `;
      });

      document.getElementById('win-total-price').innerText = totalSum;
      document.getElementById('win-modal').style.display = 'flex';
    }

    function sellWonItemsModal() {
      let totalSum = 0;
      lastWonItems.forEach(item => totalSum += item.price);
      
      balance += totalSum;
      document.getElementById('balance').innerText = balance;
      
      lastWonItems = [];
      document.getElementById('win-modal').style.display = 'none';
      if (selectedCaseKey) {
        document.getElementById('open-btn').disabled = balance < (cases[selectedCaseKey].price * openingCount);
      }
    }

    function takeWonItemsModal() {
      lastWonItems.forEach(item => inventory.push(item));
      lastWonItems = [];
      document.getElementById('win-modal').style.display = 'none';
      updateInventoryDisplay();
    }

    function updateInventoryDisplay() {
      const invGrid = document.getElementById('inventory');
      if(inventory.length === 0) {
          invGrid.innerHTML = '<div style="color:#666; width: 100%; text-align: center;">Инвентарь пуст</div>';
          return;
      }
      invGrid.innerHTML = '';
      inventory.forEach((item, index) => {
        let isSelected = (currentTab === 'upgrader' && upgInputIndex === index);
        let extraContent = currentTab === 'cases' ? `<button class="btn-sell" onclick="event.stopPropagation(); sellItem(${index})" ${isActionActive ? 'disabled':''}>Продать</button>` : '';

        invGrid.innerHTML += `
        <div class="item-card ${item.rarity} ${isSelected ? 'selected-for-upg' : ''}" style="height: ${currentTab === 'cases' ? '160px' : '130px'};" onclick="handleInventoryClick(${index})">
            <div class="item-visual"><img src="${item.img}" alt=""></div>
            <div class="item-name">${item.name}</div>
            <div class="item-price">${item.price} ₽</div>
            ${extraContent}
        </div>`;
      });
      if(upgInputIndex !== null && !inventory[upgInputIndex]) clearUpgInput();
    }

    function handleInventoryClick(index) {
      if (isActionActive) return;
      if (currentTab === 'upgrader') {
        if (upgInputIndex === index) clearUpgInput();
        else selectUpgInput(index);
      }
    }

    function sellItem(index) {
      if (isActionActive) return;
      balance += inventory[index].price;
      document.getElementById('balance').innerText = balance;
      if(upgInputIndex === index) clearUpgInput();
      inventory.splice(index, 1);
      if(upgInputIndex !== null && index < upgInputIndex) upgInputIndex--;
      updateInventoryDisplay();
      if (selectedCaseKey && currentTab === 'cases') { 
        document.getElementById('open-btn').disabled = balance < (cases[selectedCaseKey].price * openingCount); 
      }
    }

    let upgInputIndex = null;
    let upgTargetItem = null;

    function selectUpgInput(index) {
      upgInputIndex = index;
      const item = inventory[index];
      const slot = document.getElementById('upg-input');
      slot.innerHTML = `<div class="item-card ${item.rarity}"><div class="item-visual"><img src="${item.img}" alt=""></div><div class="item-name">${item.name}</div><div class="item-price">${item.price} ₽</div></div>`;
      slot.classList.add('active-slot');
      updateInventoryDisplay();
      calculateUpgChance();
    }

    function clearUpgInput() {
      upgInputIndex = null;
      const slot = document.getElementById('upg-input');
      slot.innerHTML = '<span style="color: #666; font-size: 13px;">Ваш скин<br>(Нажмите в инвентаре)</span>';
      slot.classList.remove('active-slot');
      updateInventoryDisplay();
      calculateUpgChance();
    }

    function openSkinsModal() {
      if (isActionActive) return;
      const grid = document.getElementById('skins-grid-modal');
      grid.innerHTML = '';
      Object.values(skinsData).forEach((item, index) => {
        grid.innerHTML += `<div class="item-card ${item.rarity}" onclick="setUpgTarget('${Object.keys(skinsData)[index]}')"><div class="item-visual"><img src="${item.img}" alt=""></div><div class="item-name">${item.name}</div><div class="item-price">${item.price} ₽</div></div>`;
      });
      document.getElementById('skins-modal').style.display = 'flex';
    }

    function setUpgTarget(skinKey) {
      upgTargetItem = skinsData[skinKey];
      const slot = document.getElementById('upg-target');
      slot.innerHTML = `<div class="item-card ${upgTargetItem.rarity}"><div class="item-visual"><img src="${upgTargetItem.img}" alt=""></div><div class="item-name">${upgTargetItem.name}</div><div class="item-price">${upgTargetItem.price} ₽</div></div>`;
      slot.classList.add('active-slot');
      document.getElementById('skins-modal').style.display = 'none';
      calculateUpgChance();
    }

    function calculateUpgChance() {
      const chanceText = document.getElementById('upg-chance');
      const msg = document.getElementById('upg-msg');
      const wheel = document.getElementById('upg-wheel');
      const rotatingPointer = document.getElementById('upg-rotating-pointer');
      
      msg.innerText = '';
      rotatingPointer.style.transition = 'none';
      rotatingPointer.style.transform = 'rotate(0deg)';

      if (upgInputIndex !== null && upgTargetItem !== null) {
        const inputPrice = inventory[upgInputIndex].price;
        const targetPrice = upgTargetItem.price;

        if (inputPrice >= targetPrice) {
          chanceText.innerText = '90.0%';
          chanceText.style.color = 'var(--success)';
          wheel.style.background = 'conic-gradient(#00ff88 0deg, #1b2432 360deg)';
          document.getElementById('btn-do-upgrade').disabled = false;
          return;
        }

        let ratio = inputPrice / targetPrice;
        let chance = ratio * 85; 

        if (ratio < 0.3) chance *= 0.85;
        if (ratio < 0.1) chance *= 0.7;

        if (chance < 1) chance = 1;
        if (chance > 90) chance = 90;

        chanceText.innerText = chance.toFixed(1) + '%';
        
        let colorMain = '#e74c3c';
        if (chance >= 70) colorMain = '#00ff88';
        else if (chance >= 50) colorMain = '#2ecc71';
        else if (chance >= 35) colorMain = '#f1c40f';
        else if (chance >= 20) colorMain = '#e67e22';
        
        chanceText.style.color = colorMain;
        
        const chanceAngle = (chance / 100) * 360;
        wheel.style.background = `conic-gradient(${colorMain} 0deg, ${colorMain} ${chanceAngle}deg, #161f2d ${chanceAngle}deg, #0d121a 360deg)`;
        document.getElementById('btn-do-upgrade').disabled = false;
      } else {
        chanceText.innerText = '0%';
        chanceText.style.color = '#fff';
        wheel.style.background = 'conic-gradient(#1b2432 0deg, #1b2432 360deg)';
        document.getElementById('btn-do-upgrade').disabled = true;
      }
    }

    function executeUpgrade() {
      if (upgInputIndex === null || upgTargetItem === null || isActionActive) return;
      isActionActive = true;
      document.getElementById('btn-do-upgrade').disabled = true;
      const msg = document.getElementById('upg-msg');
      msg.innerText = 'Вращение...';
      msg.style.color = '#fff';

      const inputItem = inventory[upgInputIndex];
      const targetPrice = upgTargetItem.price;
      
      let ratio = inputItem.price / targetPrice;
      let chance = (inputItem.price >= targetPrice) ? 0.90 : (ratio * 0.85);
      if (ratio < 0.3 && inputItem.price < targetPrice) chance *= 0.85;
      if (ratio < 0.1 && inputItem.price < targetPrice) chance *= 0.7;
      if (chance > 0.9) chance = 0.9;
      if (chance < 0.01) chance = 0.01;

      const chanceAngle = chance * 360;
      const isSuccess = Math.random() < chance;
      
      let targetAngle = isSuccess ? (3 + Math.random() * (chanceAngle - 6)) : (chanceAngle + 3 + Math.random() * (360 - chanceAngle - 6));
      const finalRotation = (360 * 6) + targetAngle; 
      
      const animDuration = upgFastMode ? 2 : 7.5;

      const rotatingPointer = document.getElementById('upg-rotating-pointer');
      rotatingPointer.style.transition = 'none';
      rotatingPointer.style.transform = 'rotate(0deg)';
      void rotatingPointer.offsetWidth;
      
      rotatingPointer.style.transition = `transform ${animDuration}s cubic-bezier(0.15, 0.85, 0.15, 1.0)`;
      rotatingPointer.style.transform = `rotate(${finalRotation}deg)`;

      setTimeout(() => {
        isActionActive = false;
        if (isSuccess) {
          msg.innerText = 'УСПЕШНО!';
          msg.style.color = 'var(--success)';
          inventory.splice(upgInputIndex, 1);
          inventory.push(upgTargetItem);
        } else {
          msg.innerText = 'ПРОВАЛ!';
          msg.style.color = 'var(--fail)';
          inventory.splice(upgInputIndex, 1);
        }
        clearUpgInput();
        updateInventoryDisplay();
      }, (animDuration * 1000) + 100);
    }
  </script>
</body>
</html>
